name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天更新一次抄牌組的熱門牌組
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 更新熱門牌組（失敗時沿用倉庫內的舊資料）
        run: node scripts/fetch-netdecks.mjs || echo "抓取失敗，沿用舊的 netdecks.json"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
